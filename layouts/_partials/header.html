<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    {{ partial "head_custom.html" . }}
    <link rel="stylesheet" href="/assets/css/shared.css">
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme');
          if (theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="notes-site">
    <header class="site-header">
      <a class="site-name" href="/">Binesh K Sadanandan</a>
      <nav aria-label="Main navigation">
        <a href="/research/">Research</a>
        <a href="/publications/">Publications</a>
        <a href="{{ .Site.Home.RelPermalink }}" aria-current="page">Notes</a>
        <a href="/cv/">CV</a>
        <button id="notes-theme-toggle" type="button" aria-label="Toggle dark theme" aria-pressed="false">Theme</button>
      </nav>
    </header>
    <script>
      (function () {
        var button = document.getElementById('notes-theme-toggle');
        function updateButton() {
          button.setAttribute('aria-pressed', document.documentElement.getAttribute('data-theme') === 'dark');
        }
        button.addEventListener('click', function () {
          var theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          try { localStorage.setItem('theme', theme); } catch (e) {}
          updateButton();
        });
        updateButton();
      })();
    </script>
