{{ partial "header.html" . }}

<main>
  <div class="home-intro">
    <h1>Notes</h1>
    <p>Writing on machine learning, medical AI, and research.</p>
  </div>
  <ul class="post-list">
    {{ range where .Site.RegularPages "Section" "post" }}
    <li>
      <time class="date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
      <a href="{{ .RelPermalink }}">{{ .Title | markdownify }}</a>
    </li>
    {{ end }}
  </ul>
</main>

<!-- Preserve old bookmarks for the sections moved to the main site. -->
<script>
  if (window.location.hash === '#running' || window.location.hash === '#books') {
    window.location.replace('/' + window.location.hash);
  }
</script>
{{ partial "footer.html" . }}
